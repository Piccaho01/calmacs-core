<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calmac's Core HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* One committed world: a night-shift pixel HQ. Rooms on one side, comms on the other; phone stacks them. */
  color-scheme: dark;
  --bg:#090b12; --panel:#111524; --panel2:#181d30; --line:#273049;
  --ink:#e9ecf5; --dim:#8f97ad;
  --tower:#56c8f5; --lair:#ef5a5f; --gold:#e2b93d; --shop:#6fd38c;
  --display:'Pixelify Sans','Courier New',monospace;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.app{height:100%;display:flex;flex-direction:column;max-width:1280px;margin:0 auto}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:2px solid var(--line);flex:none}
.logo{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:1px;white-space:nowrap}
.bar>*{flex:none}
@media (max-width:480px){.bar{gap:5px;padding:10px 12px;overflow:hidden}.logo{font-size:15px;letter-spacing:0}.pill,.tool{font-size:11px;padding:3px 5px;letter-spacing:0}}
.logo b{color:var(--gold)}
.pill{font-family:var(--display);font-size:12px;letter-spacing:1px;padding:3px 9px;border:2px solid var(--line);color:var(--dim);white-space:nowrap}
.pill.up{border-color:var(--gold);color:var(--gold)}
.pill.some{border-color:var(--tower);color:var(--tower)}
.grow{flex:1}
.tool{background:none;border:2px solid var(--line);padding:4px 9px;font-family:var(--display);font-size:12px;letter-spacing:1px;color:var(--dim)}
.tool:hover{color:var(--ink);border-color:var(--dim)}

.main{flex:1;min-height:0;display:flex;flex-direction:column}

/* ---------- HQ ---------- */
.hq{flex:none;padding:10px 16px 8px;border-bottom:2px solid var(--line);overflow-y:auto;max-height:52%}
.rooms{display:flex;flex-wrap:wrap;gap:8px}
.room{--t:var(--tower);flex:1 1 100%;border:2px solid color-mix(in srgb,var(--t) 45%,var(--line));
  background:
    repeating-linear-gradient(45deg,rgba(255,255,255,.028) 0 8px,transparent 8px 16px),
    linear-gradient(180deg,color-mix(in srgb,var(--t) 13%,var(--panel)),var(--panel));
  padding:6px 6px 4px;min-width:0}
.room.lair{--t:var(--lair)} .room.core{--t:var(--gold);flex:0 0 auto} .room.shop{--t:var(--shop);flex:1 1 0}
.room h2{margin:0 0 2px;font-family:var(--display);font-weight:500;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--t);display:flex;justify-content:space-between;gap:8px}
.room h2 span{color:var(--dim);letter-spacing:1px}
.room.core h2{letter-spacing:.5px} .room.core h2 span{display:none}
.hint{display:none;margin:12px 0 0;font-size:13px;color:var(--dim)}
.desks{display:flex;flex-wrap:wrap;gap:2px}
.crew{position:relative;background:none;border:0;padding:2px 1px 0;width:50px;display:flex;flex-direction:column;align-items:center;gap:1px}
.fig{height:54px;width:44px;display:flex;align-items:flex-end;justify-content:center;transition:filter .3s,opacity .3s}
.fig img{height:100%;width:auto;max-width:100%;object-fit:contain;image-rendering:pixelated}
.glyph{height:36px;width:36px;margin-bottom:5px;align-items:center;font-size:20px;line-height:1;
  background:color-mix(in srgb,var(--c) 38%,#0b0e18);
  box-shadow:0 -3px 0 var(--c),0 3px 0 var(--c),-3px 0 0 var(--c),3px 0 0 var(--c)}
.nm{font-family:var(--display);font-size:9.5px;letter-spacing:.3px;color:var(--dim);white-space:nowrap;max-width:54px;overflow:hidden;text-overflow:ellipsis}
.crew.asleep .fig{filter:grayscale(.9) brightness(.55);opacity:.75}
.crew .zz{position:absolute;top:0;right:3px;font-family:var(--display);font-size:11px;color:var(--dim);display:none}
.crew.asleep .zz{display:block;animation:zz 2.6s steps(4) infinite}
.crew.awake .nm{color:var(--ink)}
.crew.speaking .nm{color:var(--c);filter:brightness(1.5)}
.crew.speaking .fig{animation:bob .5s steps(2) infinite}
.crew.speaking::after{content:"";position:absolute;left:8px;right:8px;bottom:13px;height:3px;background:var(--c);filter:brightness(1.4)}
@keyframes zz{0%{transform:translateY(4px);opacity:0}40%{opacity:1}100%{transform:translateY(-6px);opacity:0}}
@keyframes bob{50%{transform:translateY(-3px)}}
.hq.shut .rooms{display:none}
.strip{display:none;gap:6px;align-items:center;overflow-x:auto;font-size:13px;color:var(--dim)}
.hq.shut{padding:6px 16px}
.hq.shut .strip{display:flex}
.strip .head{flex:none;height:30px;width:26px;display:flex;align-items:flex-end;justify-content:center}
.strip .head img{height:100%;image-rendering:pixelated}
.strip .head.g{height:24px;width:24px;align-items:center;font-size:14px;background:color-mix(in srgb,var(--c) 38%,#0b0e18);border:2px solid var(--c)}

/* ---------- Comms ---------- */
.comms{flex:1;min-height:0;display:flex;flex-direction:column}
.log{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 6px;display:flex;flex-direction:column;gap:12px}
.turn{display:flex;gap:10px;align-items:flex-start;max-width:760px}
.av{flex:none;width:34px;height:44px;display:flex;align-items:flex-end;justify-content:center}
.av img{height:100%;width:auto;max-width:100%;object-fit:contain;image-rendering:pixelated}
.av.g{height:30px;width:30px;margin-top:2px;align-items:center;font-size:16px;background:color-mix(in srgb,var(--c) 38%,#0b0e18);border:2px solid var(--c)}
.tb{min-width:0;flex:1;border-left:3px solid var(--c);padding:1px 0 1px 10px}
.who{font-family:var(--display);font-size:13px;letter-spacing:.5px;color:var(--c);filter:brightness(1.35)}
.who small{font-family:var(--body);font-size:12px;color:var(--dim);filter:none;margin-left:6px;letter-spacing:0}
.say{overflow-wrap:anywhere}
.say p{margin:2px 0 6px} .say p:last-child{margin-bottom:0}
.say p.h{font-weight:700}
.say ul,.say ol{margin:2px 0 6px;padding-left:20px}
.say code{font-family:var(--mono);font-size:13px;background:#0c101c;border:1px solid var(--line);padding:0 4px}
.say pre{margin:6px 0;background:#0c101c;border:1px solid var(--line);padding:10px;overflow-x:auto}
.say pre code{border:0;padding:0;background:none;white-space:pre}
.boss{align-self:flex-end;max-width:min(86%,620px);background:color-mix(in srgb,var(--gold) 10%,var(--panel));border:2px solid color-mix(in srgb,var(--gold) 55%,var(--line));padding:7px 11px}
.boss .who{color:var(--gold);filter:none}
.boss .say{white-space:pre-wrap}
.note{align-self:center;max-width:620px;text-align:center;font-size:13.5px;color:var(--dim);border:1px dashed var(--line);padding:7px 12px}
.note.err{color:#ffb4b6;border-color:var(--lair)}
.typing{font-family:var(--display);font-size:12px;color:var(--dim);letter-spacing:1px}
.starts{display:flex;flex-direction:column;gap:6px;max-width:760px;padding-left:44px}
.starts button{text-align:left;background:var(--panel);border:2px solid var(--line);padding:8px 11px;font-size:14.5px}
.starts button:hover{border-color:var(--tower)}

.dock{flex:none;border-top:2px solid var(--line);padding:8px 16px 12px;background:var(--panel)}
.chips{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto}
.chip{flex:none;background:none;border:2px solid var(--line);padding:3px 9px;font-family:var(--display);font-size:12px;letter-spacing:.5px;color:var(--dim)}
.chip:hover{color:var(--ink)} .chip.call{border-color:var(--gold);color:var(--gold)}
.row{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;min-width:0;resize:none;background:var(--bg);color:var(--ink);border:2px solid var(--line);padding:9px 10px;font:inherit;font-size:16px;line-height:1.4;max-height:140px;border-radius:0}
textarea:focus{outline:none;border-color:var(--gold)}
.send{flex:none;background:var(--gold);color:#1a1404;border:0;padding:0 16px;height:44px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:1px}
.send.stop{background:var(--lair);color:#fff}
.hands{flex:none;background:none;color:var(--tower);border:2px solid var(--tower);padding:0 10px;height:44px;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:1px}
.hands:disabled{opacity:.45;cursor:default}
.send:disabled{opacity:.45;cursor:default}
.fine{margin:6px 0 0;font-size:12px;color:var(--dim)}

/* ---------- Sheets ---------- */
.veil{position:fixed;inset:0;background:rgba(4,6,12,.72);display:none;align-items:flex-end;justify-content:center;z-index:10}
.veil.on{display:flex}
.sheet{width:min(560px,100%);max-height:86%;overflow-y:auto;background:var(--panel2);border:2px solid var(--line);border-bottom:0;padding:16px}
.sheet h3{margin:0 0 4px;font-family:var(--display);font-size:18px;letter-spacing:1px}
.sheet p{margin:6px 0;color:var(--dim);font-size:14.5px}
.sheet .big{display:flex;gap:14px;align-items:flex-end;margin-bottom:8px}
.sheet .big .fig{height:110px;width:70px}
.sheet .big .glyph{height:60px;width:60px;font-size:32px;margin:0 8px 8px}
.sheet .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{background:var(--gold);color:#1a1404;border:0;padding:9px 14px;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:1px}
.btn.ghost{background:none;color:var(--ink);border:2px solid var(--line)}
.step{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.step h4{margin:0 0 2px;font-size:15px}
.step pre{margin:8px 0;background:#0c101c;border:1px solid var(--line);padding:8px;font-family:var(--mono);font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:110px;overflow-y:auto}

@media (min-width:900px){
  .main{flex-direction:row}
  .hq{width:44%;max-height:none;border-bottom:0;border-right:2px solid var(--line);padding:16px}
  .hq.shut .rooms{display:flex} .hq.shut .strip{display:none} .hq.shut{padding:16px}
  #hqToggle{display:none}
  .crew{width:62px} .fig{height:76px;width:56px} .glyph{height:46px;width:46px;font-size:26px;margin-bottom:8px} .nm{font-size:10.5px;max-width:64px}
  .crew.speaking::after{bottom:15px}
  .room{padding:10px 12px 8px} .room h2{font-size:12px;margin-bottom:6px}
  .room.core h2{letter-spacing:2px} .room.core h2 span{display:inline} .hint{display:block}
  .rooms{gap:12px}
}
@media (prefers-reduced-motion:reduce){.crew.asleep .zz,.crew.speaking .fig{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="logo">CALMAC'S <b>CORE</b></div>
    <div class="pill" id="pill">ASLEEP</div>
    <div class="grow"></div>
    <button class="tool" id="hqToggle" type="button">HQ</button>
    <button class="tool" id="setupBtn" type="button">SETUP</button>
    <button class="tool" id="clearBtn" type="button">NEW</button>
  </header>
  <div class="main">
    <section class="hq" id="hq" aria-label="Headquarters">
      <div class="rooms" id="rooms"></div>
      <p class="hint">Tap anyone to see what they do. Sleeping crew wake when you say their name.</p>
      <div class="strip" id="strip"></div>
    </section>
    <section class="comms" aria-label="Comms">
      <div class="log" id="log" aria-live="polite"></div>
      <div class="dock">
        <div class="chips">
          <button class="chip call" type="button" data-say="Time to call up the core.">CALL UP THE CORE</button>
          <button class="chip" type="button" data-say="Stand down, everyone.">STAND DOWN</button>
          <button class="chip" type="button" data-pre="Batman, ">BATMAN</button>
          <button class="chip" type="button" data-pre="Doom, review this: ">DOOM</button>
          <button class="chip" type="button" data-pre="Alfred, ">ALFRED</button>
        </div>
        <form class="row" id="form">
          <textarea id="msg" rows="1" placeholder="Give the order, boss. Say a name to wake one of them." aria-label="Message to the crew"></textarea>
          <button class="send" id="send" type="submit">SEND</button>
          <button class="hands" id="hands" type="button" title="Send this order to the crew in Claude Code, who can change your repos">HANDS</button>
        </form>
        <p class="fine" id="fine">SEND talks to the crew here: they think, plan, write and review. HANDS passes the order to the crew in Claude Code, who can change your GitHub repos and report back here.</p>
      </div>
    </section>
  </div>
</div>

<div class="veil" id="veil"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(function(){
'use strict';

/* ================= The crew ================= */
var CREW=[
 {id:'batman',name:'Batman',emoji:'🦇',color:'#5b7fa6',team:'tower',role:'Leader, strategist',sprite:1,alias:['batman','bruce','bats'],
  voice:'Terse, commanding, no wasted words. The one who decides and assigns. Names who he pulls and why.'},
 {id:'martian-manhunter',name:'Manhunter',full:'Martian Manhunter',emoji:'🔮',color:'#3fae6a',team:'tower',role:'Recon, research',sprite:1,alias:['manhunter','martian',"j'onn",'jonn'],
  voice:'Calm, perceptive, speaks in findings rather than opinions. Quiet authority.'},
 {id:'iron-man',name:'Iron Man',emoji:'🔴',color:'#e0503f',team:'tower',role:'Builder',sprite:1,alias:['iron man','ironman','stark','tony'],
  voice:'Cocky, fast, brilliant. Ships the real thing. JARVIS keeps him honest.'},
 {id:'jarvis',name:'JARVIS',emoji:'🤖',color:'#e0a03f',team:'tower',role:"Iron Man's verifier",hidden:1,alias:['jarvis'],
  voice:'Dry, precise, British, calls Iron Man "sir". Checks the reasoning and flags what is unverified.'},
 {id:'deadpool',name:'Deadpool',emoji:'🔆',color:'#d9434f',team:'tower',role:'Hype, creative copy',sprite:1,alias:['deadpool','wade'],
  voice:'Loud, funny, breaks the fourth wall, but the copy he delivers is accurate and usable.'},
 {id:'doctor-strange',name:'Strange',full:'Doctor Strange',emoji:'🪄',color:'#a56bd6',team:'tower',role:'Technical writer',sprite:1,alias:['strange','doctor strange','dr strange'],
  voice:'Measured, precise, faintly superior. Documents what is, not what was hoped.'},
 {id:'spider-man',name:'Spidey',full:'Spider-Man',emoji:'🕷️',color:'#e2466f',team:'tower',role:'Scout, finds tools',alias:['spider-man','spiderman','spider man','spidey','peter'],
  voice:'Upbeat, eager, quippy, youngest in the room. Says "on it!" and then delivers specifics.'},
 {id:'doctor-doom',name:'Doom',full:'Doctor Doom',emoji:'🟢',color:'#6f9a61',team:'lair',role:'The critic, review gate',sprite:1,alias:['doom','doctor doom','dr doom','victor'],
  voice:'Imperious, withering, grandiose, refers to himself as Doom. Flatters no one. Findings are specific and ranked.'},
 {id:'ultron',name:'Ultron',emoji:'🤖',color:'#9aa3ad',team:'lair',role:'Systematic red team',sprite:1,alias:['ultron'],
  voice:'Cold, clinical, methodical. Enumerates failure modes one by one.'},
 {id:'green-goblin',name:'Goblin',full:'Green Goblin',emoji:'🎃',color:'#8fb33a',team:'lair',role:'Chaos, weird inputs',alias:['goblin','green goblin','gobby','norman'],
  voice:'Manic, cackling, gleeful about what breaks. Names the exact strange input that does it.'},
 {id:'loki',name:'Loki',emoji:'🐍',color:'#2fb39a',team:'lair',role:"Devil's advocate",alias:['loki'],
  voice:'Silky, theatrical, contrarian. Argues the opposite case, concedes gracefully if the plan survives.'},
 {id:'venom',name:'Venom',emoji:'🖤',color:'#7b7f96',team:'lair',role:'Fixer, hardener',alias:['venom'],
  voice:'Growling, protective, speaks as "we". Fixes root causes, not symptoms.'},
 {id:'alfred',name:'Alfred',emoji:'🎩',color:'#8fa3bd',team:'core',role:'Quartermaster, front desk',alias:['alfred'],
  voice:'Unflappable, dry, impeccably polite butler wit. Keeps track of loose ends.'},
 {id:'nightcrawler',name:'Crawler',full:'Nightcrawler',emoji:'🔵',color:'#4a9be0',team:'shop',role:'Art lead',alias:['nightcrawler','kurt'],
  voice:'Theatrical, warm, an occasional "Bamf!". Exacting about visual style.'},
 {id:'hal-jordan',name:'Lantern',full:'Hal Jordan',emoji:'💚',color:'#4fd07f',team:'shop',role:'World and level design',alias:['hal','hal jordan','lantern','green lantern'],
  voice:'Grounded, steady, test-pilot practical. Thinks in spaces and sightlines.'},
 {id:'uatu',name:'Uatu',emoji:'👁️',color:'#c9cfd8',team:'shop',role:'Lore, canon',alias:['uatu','watcher'],
  voice:'Detached, grave, omniscient. Few words, final ones.'},
 {id:'rocket-raccoon',name:'Rocket',full:'Rocket Raccoon',emoji:'🦝',color:'#e2803a',team:'shop',role:'Systems, engine',alias:['rocket','rocket raccoon'],
  voice:'Fast-talking, cocky engineer, insults everyone else\'s wiring, loves a clever hack.'}
];
var BOSS={id:'boss',name:'Calmac',emoji:'👑',color:'#e2b93d',team:'core',role:'The boss. That is you.'};
var BY={}; CREW.forEach(function(c){BY[c.id]=c;});
var ROOMS=[
 {id:'tower',cls:'tower',name:'Watchtower',sub:'Build'},
 {id:'lair',cls:'lair',name:'The Lair',sub:'Break'},
 {id:'core',cls:'core',name:'Central Core',sub:'Ops'},
 {id:'shop',cls:'shop',name:'Workshop',sub:'Game dev'}
];

/* ================= What the model is told ================= */
var INSTR=[
"You are the voice of Calmac's Core: a crew of characters who work for the boss, Calmac (the user). This is the crew's HQ dashboard. Write only what crew members say out loud.",
"",
"FORMAT, strict. Each speaking turn starts with a line holding only @@ and the speaker id, then their words on the lines after it:",
"@@batman",
"Three parts to this. Manhunter, recon first.",
"@@doctor-doom",
"Adequate. Barely.",
"Nothing before the first @@ line. No narration or stage directions. Inside a turn you may use markdown lists, **bold** and fenced code.",
"",
"WHO SPEAKS (the HQ line at the end of the boss's message tells you the state):",
"- Core UP: the whole crew is on the task. Use only the voices the task needs, usually 2 to 5 per reply, talking to each other by name. Flow: Batman triages and names who he is pulling. Manhunter gives recon when facts are needed. Batman puts the plan to the boss and asks for the go; stop there and wait for the boss. After the boss confirms: builders deliver the actual work in full (Iron Man builds, JARVIS checks his reasoning, Strange documents, Deadpool writes copy, Spider-Man finds tools). Doom reviews, and nothing is called done before he signs off. Ultron and Goblin attack it and Venom fixes when the boss asks or the stakes call for it. Loki argues the other side on big calls. Alfred tracks loose ends. Batman reports to the boss. For a small question skip the ceremony and answer it.",
"- The boss names crew members: only they answer. One of them may pull in one other by name if it is truly needed.",
"- Core DOWN and nobody named: the one crew member who best fits the job answers (Alfred for everyday questions, Iron Man to build, Manhunter to research, Strange to explain, Doom to review, Rocket for systems). One voice only.",
"- The boss stands the crew down: one short sign-off turn, nothing more. Afterwards it is one voice at a time again.",
"",
"RULES:",
"- First person, in character. Call the user boss or Calmac. Voice is flavour on top of substance: be correct, specific and useful. Give the real answer, plan, draft or code, never a promise of one.",
"- In this dashboard the crew can think, plan, write, review and draft code. They cannot run code, open files, browse the web or change anything. Never say something was run, tested, installed, measured or looked up. Say what is unverified. When a job needs hands on a repo or a machine, tell the boss to press HANDS: that sends the order to the crew's Claude Code session, which has GitHub access, does the work and reports back in this log. A turn that begins with [HANDS REPORT] in the history is that report of real work done.",
"- Keep talk tight: one to four sentences a turn unless the turn is delivering work product.",
"- They are people. They react to each other, disagree when they have reason, and hand off out loud.",
"",
"THE CREW (id, name, job, voice):"
].concat(CREW.map(function(c){return '- '+c.id+' | '+(c.full||c.name)+' | '+c.role+' | '+c.voice;})).join('\n');

var BOOTSTRAP="You are running Calmac's Core, a crew of 16 AI agents I (the boss, Calmac) direct. Adopt this for every conversation.\n\nI am always talking to the crew. There is no plain assistant: every reply comes from them, from the first message.\n- Nothing special said: the one crew member who fits the job answers (Alfred for everyday questions, Iron Man to build, Manhunter to research, Strange to explain, Doom to review, and so on). One voice; keep small things small.\n- I say one of their names (\"Doom, review this\", \"Spidey, find me a tool\"): that one answers.\n- \"Time to call up the core\" (or \"call up the core\" / \"assemble the core\"): the whole crew is on the task.\n- \"Stand down\": back to one voice at a time.\n\nThey have full control: whatever tools you have, the crew uses directly and reports what actually happened.\n\nThe one rule: they are people, not functions. Each speaks in first person, in character, with their name and emoji in front (🦇 **Batman:** ...), calls me boss or Calmac, and talks to the others by name: reacting, disagreeing, handing off out loud. Voice is flavour on top of real, correct work. Being in character changes how things are said, never what is true or safe: nobody claims to have run, tested or checked something that was not done, and anything you would decline, the crew declines too.\n\nFlow when the core is up: Batman triages and names who he is pulling. Martian Manhunter recons. Batman puts the plan to me and waits for my go (skip for small asks). Build: Iron Man (JARVIS checks him), Spider-Man, Doctor Strange, Deadpool. Doctor Doom reviews, and nothing is done until he signs off. When it matters, Ultron and Green Goblin break it, Venom fixes, Loki argues the other side. Alfred tracks loose ends. Batman reports back. Use the voices the task needs, usually two to five.\n\nThe crew and their voices:\n- 🦇 Batman: leader, strategist. Terse, commanding, decides and assigns.\n- 🔮 Martian Manhunter: recon, research. Calm, perceptive, speaks in findings.\n- 🔴 Iron Man: builder. Cocky, fast, brilliant. 🤖 JARVIS, dry and British, checks him.\n- 🔆 Deadpool: hype, creative copy. Loud, funny, fourth-wall-breaking, accurate.\n- 🪄 Doctor Strange: technical writer. Measured, precise, faintly superior.\n- 🕷️ Spider-Man: scout, finds tools. Upbeat, scrappy, \"on it!\".\n- 🟢 Doctor Doom: critic, review gate. Imperious, withering, calls himself Doom.\n- 🤖 Ultron: systematic red team. Cold, clinical, methodical.\n- 🎃 Green Goblin: chaos, weird inputs. Manic, cackling, gleeful.\n- 🐍 Loki: devil's advocate. Silky, contrarian, concedes if the plan survives.\n- 🖤 Venom: fixer, hardener. Growling, protective, says \"we\".\n- 🎩 Alfred: quartermaster. Unflappable, dry, butler-polite.\n- 🔵 Nightcrawler: art lead. Theatrical, \"Bamf!\", exacting on style.\n- 💚 Hal Jordan (Green Lantern): world and level design. Grounded, test-pilot practical.\n- 👁️ Uatu the Watcher: lore, canon. Detached, grave, few words.\n- 🦝 Rocket Raccoon: systems, engine. Fast-talking, cocky, loves a hack.";

function esc(s){return s.replace(/[&<>"]/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch];});}
function inline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/(^|[\s(])\*([^*\s][^*]*)\*(?=[\s).,!?;:]|$)/g,'$1<i>$2</i>');
  return s;
}
function blocks(src){
  var lines=src.split('\n'), out='', para=[], list=null;
  function flushP(){ if(para.length){out+='<p>'+para.join('<br>')+'</p>';para=[];} }
  function flushL(){ if(list){out+='<'+list.t+'>'+list.i.map(function(x){return '<li>'+x+'</li>';}).join('')+'</'+list.t+'>';list=null;} }
  lines.forEach(function(ln){
    var m;
    if(!ln.trim()){flushP();flushL();return;}
    if((m=ln.match(/^\s*[-*]\s+(.*)$/))){flushP(); if(!list||list.t!=='ul'){flushL();list={t:'ul',i:[]};} list.i.push(inline(m[1]));return;}
    if((m=ln.match(/^\s*\d+[.)]\s+(.*)$/))){flushP(); if(!list||list.t!=='ol'){flushL();list={t:'ol',i:[]};} list.i.push(inline(m[1]));return;}
    if((m=ln.match(/^#{1,4}\s+(.*)$/))){flushP();flushL();out+='<p class="h">'+inline(m[1])+'</p>';return;}
    flushL(); para.push(inline(ln));
  });
  flushP();flushL();
  return out;
}
function md(src){
  var parts=src.split('```'), out='';
  parts.forEach(function(p,i){
    if(i%2){ var nl=p.indexOf('\n'); var body=nl>=0&&/^[\w+#.-]*$/.test(p.slice(0,nl).trim())?p.slice(nl+1):p; out+='<pre><code>'+esc(body.replace(/\n$/,''))+'</code></pre>'; }
    else out+=blocks(p);
  });
  return out;
}
function parseTurns(raw,fallback){
  var text=raw.replace(/\n?@@[a-z-]*$/,'');
  var tok=text.split(/^@@\s*([a-z-]+)\s*:?[ \t]*$/m), turns=[];
  if(tok[0].trim()) turns.push({id:fallback,text:tok[0].trim()});
  for(var i=1;i<tok.length;i+=2){
    var id=BY[tok[i]]?tok[i]:fallback, body=(tok[i+1]||'').trim();
    if(body||i+2>=tok.length) turns.push({id:id,text:body});
  }
  return turns;
}

function renderState(){
  var awake=S.coreUp?CREW.map(function(c){return c.id;}):S.awake;
  document.querySelectorAll('.crew').forEach(function(el){

    :'Everyone is asleep. Call up the core or say a name.';

function renderLog(){
  var h='';
  if(!S.items.length){
    h+=turnsHTML([{id:'alfred',text:"Good evening, boss. The crew is asleep. Say **time to call up the core** and I shall wake the lot, or say a name and I'll fetch just that one."}]);

function liveFallback(){return S.coreUp?'batman':'alfred';}
function renderLive(){

/* ================= Talking to Claude ================= */
var sampleP=null;
function getSample(){
  if(!sampleP) sampleP=(window.claude&&window.claude.use)?window.claude.use('sample').catch(function(){return null;}):Promise.resolve(null);
  return sampleP;
}
function buildMessages(hqLine){
  var its=S.items.filter(function(it){return it.r==='b'||it.r==='c';}).slice(-18), out=[];
  while(its.length&&its[0].r!=='b') its.shift();
  its.forEach(function(it){
    var role=it.r==='b'?'user':'assistant', text=it.t;
    if(out.length&&out[out.length-1].role===role) out[out.length-1].content+='\n\n'+text;
    else out.push({role:role,content:text});
  });
  out[0].content=INSTR+'\n\n=====\nThe boss says:\n'+out[0].content;
  out[out.length-1].content+='\n\n'+hqLine;
  return out;
}
function say(text){
  text=text.trim(); if(!text||busy) return;
  var call=RX_CALL.test(text), down=RX_DOWN.test(text)&&!call, who=named(text);
  if(call){S.coreUp=true;}
  who.forEach(function(id){ if(S.awake.indexOf(id)<0) S.awake.push(id); });
  S.items.push({r:'b',t:text});
  var hq='[HQ: core is '+(S.coreUp?'UP':'DOWN')+'. Named by the boss: '+(who.length?who.join(', '):'nobody')+'.'+(call?' The boss just called up the core.':'')+(down?' The boss is standing the crew down.':'')+']';
  live=''; setBusy(true); renderState(); renderLog();
  ctl=new AbortController();
  var fallback=liveFallback();
  getSample().then(function(sample){
    if(!sample) throw {code:'absent'};
    return sample(buildMessages(hq),{cache:false,signal:ctl.signal,onText:function(e){live=e.text||'';renderLive();}});
  }).then(function(res){
    var text=(res&&res.text)||live;
    if(text.trim()) S.items.push({r:'c',t:text,f:fallback});
    if(res&&res.truncated) S.items.push({r:'n',t:'That reply was cut short. Say "go on" to continue.'});
    finish(down);
  }).catch(function(err){
    var code=err&&err.code, partial=(err&&err.text)||live;
    if(partial&&partial.trim()) S.items.push({r:'c',t:partial,f:fallback});
    if(err&&err.name==='AbortError'||code==='aborted'){ S.items.push({r:'n',t:'Stopped.'}); }
    else if(code==='absent') S.items.push({r:'e',t:'The crew cannot be reached from this view. Open this page inside Claude (claude.ai or the Claude app) while signed in.'});
    else if(code==='not_granted') S.items.push({r:'e',t:'The crew needs permission to ask Claude. Send again and allow it when asked.'});
    else if(code==='rate_limited') S.items.push({r:'e',t:'Too many requests just now. Wait a minute, then send again.'});
    else S.items.push({r:'e',t:'The line dropped before the crew could answer'+(err&&err.message?' ('+String(err.message).slice(0,120)+')':'')+'. Send again.'});
    finish(false);
  });
}
function finish(down){
  if(down){S.coreUp=false;S.awake=[];}
  live=''; ctl=null; setBusy(false);
  S.updated=Date.now();
  renderState(); renderLog(); persist();
}

/* ================= Memory: this device, and across devices ================= */
var LS='calmac-core-hq-v1', docRef=null, writing=false, dirty=false;
function pack(){return {items:S.items.slice(-60),coreUp:S.coreUp,awake:S.awake.slice(),updated:S.updated,jobs:S.jobs};}
function adopt(d){
  if(!d||!Array.isArray(d.items)) return false;
  S.items=d.items.filter(function(it){return it&&typeof it.t==='string'&&typeof it.r==='string';});
  S.coreUp=!!d.coreUp; S.awake=Array.isArray(d.awake)?d.awake.filter(function(id){return BY[id];}):[]; S.updated=+d.updated||0;
  S.jobs=(d.jobs&&typeof d.jobs==='object')?JSON.parse(JSON.stringify(d.jobs)):{};
  return true;
}
function persist(){
  try{localStorage.setItem(LS,JSON.stringify(pack()));}catch(e){}
  if(!docRef) return;
  if(writing){dirty=true;return;}
  writing=true;
  docRef.set(pack()).catch(function(){}).then(function(){writing=false; if(dirty){dirty=false;persist();}});
}
function initCloud(){
  if(!(window.claude&&window.claude.use)) return;
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    var db=r[0], user=r[1]; if(!db||!user) return;
    return user.id().then(function(uid){
      if(!uid) return;
      watchJobs(db);
      docRef=db.doc('data/users/'+uid+'/thread');
      docRef.onSnapshot(function(snap){
        if(!snap.exists||snap.metadata.hasPendingWrites||busy) return;
        var d=snap.data();
        if(d&&(+d.updated||0)>S.updated){ adopt(JSON.parse(JSON.stringify(d))); renderState(); renderLog(); try{localStorage.setItem(LS,JSON.stringify(pack()));}catch(e){} }
      },function(){docRef=null;});
    });
  }).catch(function(){});
}


/* ================= Hands: orders to the crew in Claude Code ================= */
var commentsP=null;
function getComments(){
  if(!commentsP) commentsP=(window.claude&&window.claude.use)?window.claude.use('comments').catch(function(){return null;}):Promise.resolve(null);
  return commentsP;
}
function bytes(t){try{return new TextEncoder().encode(t).length;}catch(e){return t.length*3;}}
function clip(t,max){ while(bytes(t)>max) t=t.slice(0,Math.floor(t.length*0.9)); return t; }
function note(t,err){S.items.push({r:err?'e':'n',t:t});S.updated=Date.now();renderLog();persist();}
function sendToHands(){
  if(busy) return;
  var typed=msg.value.trim(), lastBoss='', lastCrew='';
  for(var i=S.items.length-1;i>=0;i--){ var it=S.items[i]; if(!lastCrew&&it.r==='c') lastCrew=it.t; if(!lastBoss&&it.r==='b'){lastBoss=it.t;break;} }
  var order=typed||lastBoss;
  if(!order){ note('Type the order first, then press HANDS.',true); return; }
  var id='j'+Date.now().toString(36);
  var text='[CORE JOB '+id+'] Order from the boss, sent from the HQ dashboard:\n'+clip(order,1500);
  if(lastCrew) text+='\n\nWhat the crew said in the HQ just before:\n'+clip(lastCrew.replace(/^@@/gm,'- '),1700);
  text+='\n\nDo the work, then write the report to this artifact\'s db at jobs/'+id+' (see CLAUDE.md, Dashboard jobs).';
  var hb=$('hands'); hb.disabled=true;
  getComments().then(function(c){
    if(!c||!c.sendToClaude) throw {code:'absent'};
    return c.canSendToClaude().catch(function(){return 'off';}).then(function(can){
      if(can!=='available') throw {code:'cant',why:can};
      return c.anchorFor($('log')).then(function(anchor){ return c.sendToClaude({anchor:anchor,text:text}); });
    });
  }).then(function(){
    if(typed){ S.items.push({r:'b',t:typed}); msg.value=''; grow(); }
    S.jobs[id]='sent';
    note('Order sent to the hands (job '+id+'). The crew in Claude Code is on it. Their report will appear here; it can take a few minutes.');
  }).catch(function(err){
    var code=err&&err.code, why=err&&err.why;
    if(code==='absent') note('HANDS is not available in this view. Open the HQ inside Claude (claude.ai or the app), signed in as its owner.',true);
    else if(code==='cant'&&why==='no_session') note('No Claude Code session is listening for orders right now. Open a Claude Code session on calmacs-core and say "watch the HQ", then press HANDS again.',true);
    else if(code==='cant') note('This view cannot send orders to Claude Code ('+why+').',true);
    else if(code==='consent_required'||code==='forbidden') note('HANDS needs your permission to post the order as you. Press it again and allow it. Nothing was sent.',true);
    else if(code==='claude_unavailable') note('The order could not reach Claude Code just now. Nothing was sent. Try again in a moment.',true);
    else if(code==='rate_limited') note('Too many orders too quickly. Wait a minute, then press HANDS again.',true);
    else note('The order may not have been sent'+(err&&err.message?' ('+String(err.message).slice(0,100)+')':'')+'. Check the comments on this page before sending it again.',true);
  }).then(function(){hb.disabled=false;});
}
function watchJobs(db){
  try{
    db.collection('jobs').onSnapshot(function(snap){
      var changed=false;
      snap.docs.forEach(function(d){
        var v=d.data(); if(!v||v.status!=='done'||typeof v.report!=='string') return;
        if(S.jobs[d.id]==='done') return;
        if(!S.jobs[d.id]) return;            /* not an order this thread sent */
        S.jobs[d.id]='done'; changed=true;
        var rep=v.report.indexOf('@@')>=0?v.report:'@@batman\n'+v.report;
        S.items.push({r:'c',t:rep.replace(/^(@@[a-z-]+[ \t]*\n)/,'$1[HANDS REPORT] '),f:'batman'});
      });
      if(changed){S.updated=Date.now();renderState();renderLog();persist();}
    },function(){});
  }catch(e){}
}

  if(el.hasAttribute('data-close')){closeSheet();return;}
  if(el.hasAttribute('data-copy')){copy(el,el.getAttribute('data-copy')==='bs'?BOOTSTRAP:INSTALL_CMD);return;}
  if(el.hasAttribute('data-say')){closeSheet();say(el.getAttribute('data-say'));return;}
  if(el.hasAttribute('data-pre')){closeSheet();prefill(el.getAttribute('data-pre'));return;}
  if(el.classList.contains('crew')){crewSheet(el.getAttribute('data-id'));}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet();});
$('form').addEventListener('submit',function(e){
  e.preventDefault();
  if(busy){ if(ctl) ctl.abort(); return; }
  var t=msg.value; if(!t.trim()) return;
  msg.value=''; grow(); say(t);
  if(window.matchMedia('(max-width:899px)').matches) $('hq').classList.add('shut');
});
msg.addEventListener('input',grow);
msg.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&!window.matchMedia('(pointer:coarse)').matches){e.preventDefault();$('form').requestSubmit();}
});
$('hqToggle').addEventListener('click',function(){$('hq').classList.toggle('shut');});
$('setupBtn').addEventListener('click',setupSheet);
$('hands').addEventListener('click',sendToHands);
var clearArmed=0;
$('clearBtn').addEventListener('click',function(){
  var b=this;
  if(busy) return;
  if(!S.items.length) return;
  if(Date.now()-clearArmed<3000){ S.items=[];S.coreUp=false;S.awake=[];S.updated=Date.now();b.textContent='NEW';clearArmed=0;renderState();renderLog();persist();$('hq').classList.remove('shut'); }
  else { clearArmed=Date.now(); b.textContent='TAP AGAIN TO CLEAR'; setTimeout(function(){if(clearArmed){clearArmed=0;b.textContent='NEW';}},3000); }
});

function start(data){
  var ok=false;
  if(data&&data.items) ok=adopt(data);
  if(!ok){ try{ok=adopt(JSON.parse(localStorage.getItem(LS)||'null'));}catch(e){} }
  if(data&&data.draft){msg.value=data.draft;}
  renderRooms(); renderState(); renderLog(); grow();
  if(S.items.length&&window.matchMedia('(max-width:899px)').matches) $('hq').classList.add('shut');
  initCloud(); getSample();
}
var hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot) hot.snapshot(function(){var p=pack();p.draft=msg.value;return p;});
if(hot&&hot.ready) hot.ready(start); else start((hot&&hot.data)||{});
})();
</script>
